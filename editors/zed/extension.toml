id = "foxlang"
name = "Skrumi"
version = "8.17.2"
schema_version = 1
authors = ["SkrinVex <skrinvex@gmail.com>"]
description = "Official Skrumi language support for Zed: syntax highlighting, brackets, LSP integration (diagnostics, completions, hover, goto definition) and a debugger."
repository = "https://github.com/SkrinVex/Skrumi"

[lib]
kind = "Rust"
version = "0.7.0"

[grammars.c]
repository = "https://github.com/tree-sitter/tree-sitter-c"
commit = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"


[language_servers.foxlang-lsp]
name = "skrumi-lsp"
languages = ["FoxLang"]

[debug_adapters.FoxLang]
schema_path = "debug_adapter_schemas/FoxLang.json"
