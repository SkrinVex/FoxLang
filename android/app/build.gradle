plugins { id 'com.android.application' }
def parts = file('../../VERSION').text.trim().split('\\.').collect { it.toInteger() }
def demo = (project.findProperty('skrumiDemo'))
if (demo != null && demo != 'raycaster') throw new GradleException('Unknown skrumiDemo: ' + demo)
if (demo != null && (project.hasProperty('skrumiAssets'))) throw new GradleException('Use skrumiDemo or skrumiAssets, not both')
android {
    namespace 'org.skrumi.runner'
    compileSdk 35
    ndkVersion '27.3.13750724'
    if ((System.getenv('SKRUMI_NDK_DIR'))) ndkPath (System.getenv('SKRUMI_NDK_DIR'))
    defaultConfig {
        applicationId(project.findProperty('skrumiApplicationId') ?: (demo == 'raycaster' ? 'org.skrumi.raycaster' : 'org.skrumi.runner'))
        minSdk 28
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName file('../../VERSION').text.trim()
        resValue 'string', 'app_name', (project.findProperty('skrumiAppName')) ?: (demo == 'raycaster' ? 'Skrumi Raycaster' : 'Skrumi')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    if ((project.hasProperty('skrumiAssets'))) sourceSets.main.assets.srcDirs = [file((project.property('skrumiAssets')))]
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
if (demo == 'raycaster') {
    def demoAssets = layout.buildDirectory.dir('generated/raycaster-assets')
    def stageDemo = tasks.register('stageRaycasterDemo', Sync) {
        from('../../examples/raycaster.skm') { into 'program' }
        into demoAssets
        doLast { new File(demoAssets.get().asFile, 'skrumi-entry.txt').text = 'raycaster.skm' }
    }
    android.sourceSets.main.assets.srcDirs = [demoAssets]
    tasks.named('preBuild').configure { dependsOn stageDemo }
}
dependencies {
    implementation project(':skrumi')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
