name: Android

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: android-ci

permissions:
  contents: read

concurrency:
  group: skrumi-android-${{ inputs.artifact-name || 'ci' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.artifact-name != 'android-release' }}

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build AAR and installable demo for all four ABIs
        working-directory: android
        run: ./gradlew --no-daemon :skrumi:assembleRelease :app:assembleDebug -PskrumiAbis=arm64-v8a,armeabi-v7a,x86_64,x86
      - name: Verify packaging and 16 KB compatibility
        run: |
          python3 tests/test_android_packaging.py
          python3 tests/test_android_trace.py
          python3 tests/test_android_artifacts.py --aar android/skrumi/build/outputs/aar/skrumi-release.aar --apk android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist-android
          cp android/skrumi/build/outputs/aar/skrumi-release.aar dist-android/skrumi-android.aar
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/skrumi-android-demo.apk
      - name: Build and verify the raycaster APK from the shared example
        run: |
          android/gradlew -p android --no-daemon :app:assembleDebug -PskrumiDemo=raycaster -PskrumiAbis=arm64-v8a,armeabi-v7a,x86_64,x86
          python3 tests/test_android_artifacts.py --aar dist-android/skrumi-android.aar --apk android/app/build/outputs/apk/debug/app-debug.apk --source examples/raycaster.skm
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/skrumi-android-raycaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || 'android-ci' }}
          path: dist-android/*

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the real Android runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            android/gradlew -p android --no-daemon :skrumi:connectedDebugAndroidTest :app:connectedDebugAndroidTest -PskrumiAbis=x86_64 -PskrumiDemo=raycaster
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='org.skrumi.raycaster'"
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            python3 packaging/profile_android.py --output android-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tests-${{ inputs.artifact-name || 'ci' }}-api-${{ matrix.api }}
          path: |
            android/skrumi/build/reports/androidTests/
            android/app/build/reports/androidTests/
            android-profile/
