name: Site (GitHub Pages)

# The site/ folder is the project's web page: https://skrinvex.github.io/FoxLang/
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'VERSION'
      - 'tests/**'
      - 'std/**'
      - 'src/core/builtins/**'
      - 'src/graphics/Builtins.cpp'
      - 'packaging/site_facts.py'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  # A new release brings new benchmark results for the page.
  workflow_run:
    workflows: ["Build and Auto Release FoxLang"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Take the latest release's benchmark results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern benchmarks.json --dir site --clobber \
            || echo "The latest release has no benchmarks.json; the page shows the numbers it carries."
      # The numbers on the page (version, builtins, modules, tests) come from the code
      # being published, whatever the committed page says. Counting the tests needs
      # a configured build tree, not a build.
      - name: Put the current numbers on the page
        run: |
          sudo apt-get update && sudo apt-get install -y libxcb1-dev libxau-dev libxdmcp-dev
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          python3 packaging/site_facts.py --build build --write
      # The playground runs FoxLang in the visitor's browser: the interpreter built
      # for WebAssembly, checked on its examples before it is published.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Build FoxLang for the playground
        run: |
          emcmake cmake -S . -B web -DCMAKE_BUILD_TYPE=Release
          cmake --build web -j4
          cp web/foxlang.js web/foxlang.wasm web/foxlang-graphics.js web/foxlang-graphics.wasm site/playground/
          node tests/web/test_playground.js site/playground
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
