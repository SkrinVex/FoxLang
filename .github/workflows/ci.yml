name: FoxLang CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: foxlang-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: docker/setup-buildx-action@v3
      - name: Install native-window test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6
      - name: Build static musl binaries and run CTest inside Alpine
        run: docker buildx build --target portable --output type=local,dest=build-portable .
      - name: Verify no shared libraries and run standalone tests on Ubuntu
        run: xvfb-run -a python3 tests/standalone/test_portable_linux.py build-portable/foxlang

  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    name: desktop-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux graphics development and test packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxau-dev libxdmcp-dev xvfb libx11-6

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure -LE standalone

      - name: Build and run standalone executables in clean temporary directories
        shell: bash
        env:
          FOXLANG_REQUIRE_GRAPHICS_TESTS: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure -L standalone
          else
            ctest --test-dir build -C Release --output-on-failure -L standalone
          fi

      - name: Verify Version and Help
        shell: bash
        run: |
          BIN=./build/foxlang
          LSP_BIN=./build/foxlang-lsp
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "./build/Release/foxlang.exe" ]; then
              BIN=./build/Release/foxlang.exe
              LSP_BIN=./build/Release/foxlang-lsp.exe
            else
              BIN=./build/foxlang.exe
              LSP_BIN=./build/foxlang-lsp.exe
            fi
          fi
          test "$($BIN --version)" = "FoxLang $(tr -d '[:space:]' < VERSION)"
          $BIN --help | grep -q "github.com/SkrinVex/FoxLang"
          $BIN --help | grep -q "DOCUMENTATION.md"
          test "$($LSP_BIN --version)" = "foxlang-lsp $(tr -d '[:space:]' < VERSION)"
          $LSP_BIN --help | grep -q "Language Server"
