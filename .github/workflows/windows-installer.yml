name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [master]
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  released-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build current Skrumi package
        shell: pwsh
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF
          cmake --build build --config Release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/skrumi.exe,build/Release/skrumi-lsp.exe,VERSION dist/
          Copy-Item std,editors dist/ -Recurse
          Copy-Item packaging/windows/install.*,packaging/windows/uninstall.* dist/
          $Version = (Get-Content VERSION -Raw).Trim()
          python packaging/package_vsix.py editors/vscode $Version "dist/skrumi-$Version.vsix"
      - name: Test repaired package with Windows PowerShell 5.1 and CMD
        shell: powershell
        run: ./packaging/windows/test_install.ps1 -PackageDir ./dist
      - name: Test repaired package with PowerShell 7
        shell: pwsh
        run: ./packaging/windows/test_install.ps1 -PackageDir ./dist -Direct
