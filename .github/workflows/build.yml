name: Build and Auto Release FoxLang

on:
  push:
    branches: [master]
    paths:
      - VERSION

permissions:
  contents: write

concurrency:
  group: foxlang-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source version
        run: |
          cmake -B build-check -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-check --config Release
          test "$(./build-check/foxlang --version)" = "FoxLang ${{ steps.version.outputs.version }}"

  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux binary and run tests
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          cp build/foxlang foxlang.bin
      - name: Build installable Linux package
        shell: bash
        run: |
          PKG="FoxLang-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "$PKG"
          cp foxlang.bin "$PKG/foxlang.bin"
          cp VERSION "$PKG/VERSION"
          cp packaging/linux/install.sh "$PKG/install.sh"
          chmod +x "$PKG/install.sh" "$PKG/foxlang.bin"
          cp -R std "$PKG/std"
          tar -czf "$PKG.tar.gz" "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: FoxLang-*-linux-x86_64.tar.gz

  build-windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows binary and run tests
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          mkdir -p dist
          if [ -f "./build/Release/foxlang.exe" ]; then
            cp ./build/Release/foxlang.exe dist/foxlang.exe
          else
            cp ./build/foxlang.exe dist/foxlang.exe
          fi
      - shell: pwsh
        run: Compress-Archive -Path dist/foxlang.exe -DestinationPath "FoxLang-${{ needs.version.outputs.version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: FoxLang-*-windows-x86_64.zip

  release:
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist

      - name: Create version tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "FoxLang ${TAG#v}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FoxLang ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
