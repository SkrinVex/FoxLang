name: Build and Auto Release Skrumi

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified release (master only; false builds a candidate)
        type: boolean
        default: false
      allow_slower:
        description: Release even if the benchmarks got slower (a deliberate trade-off)
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: skrumi-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          REQUEST_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$REQUEST_PUBLISH" = true ]; then
            test "$GITHUB_REF" = refs/heads/master
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo 'This version already has a tag; refusing to overwrite it.' >&2
              exit 1
            fi
          fi
          echo "publish=$REQUEST_PUBLISH" >> "$GITHUB_OUTPUT"

  # Release artifacts are exactly the candidates exercised by the ordinary CI.
  validated-builds:
    needs: version
    uses: ./.github/workflows/ci.yml

  build-android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      artifact-name: android-release

  editors:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist-editors
          python3 packaging/package_vsix.py editors/vscode "${{ needs.version.outputs.version }}" dist-editors/skrumi.vsix
          cp dist-editors/skrumi.vsix dist-editors/foxlang.vsix
          cp editors/kate/foxlang.xml dist-editors/skrumi.xml
          cp editors/kate/foxlang.xml dist-editors/foxlang.xml
      - uses: actions/upload-artifact@v4
        with:
          name: editors-release
          path: dist-editors/*
          if-no-files-found: error

  benchmarks:
    needs: [version, validated-builds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-runtime
          path: new
      - name: Install the languages compared
        run: sudo apt-get update && sudo apt-get install -y lua5.4 ruby
      - name: Download and prepare the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/prepare_benchmark_baseline.py old
      - name: Run benchmarks
        env:
          ALLOW_SLOWER: ${{ inputs.allow_slower }}
        run: |
          chmod +x new/skrumi
          ARGS=()
          if [ -f old/baseline-path ]; then ARGS+=(--baseline "$(cat old/baseline-path)"); fi
          if [ "$ALLOW_SLOWER" = true ]; then ARGS+=(--max-slowdown 1000); fi
          python3 benchmarks/run.py --foxlang new/skrumi "${ARGS[@]}" \
            --require python --require lua --require ruby --require javascript --json benchmarks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks-release
          path: benchmarks.json
          if-no-files-found: error

  assemble:
    needs: [version, validated-builds, build-android, editors, benchmarks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-installer-candidate-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: editors-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: benchmarks-release
          path: dist
      - name: Check the complete public asset inventory
        run: python3 packaging/verify_release_assets.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, assemble]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Recheck the public asset inventory
        run: python3 packaging/verify_release_assets.py dist
      - name: Create version tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Skrumi ${TAG#v}"
          git push origin "$TAG"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Skrumi ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
