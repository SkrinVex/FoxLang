name: Release FoxLang

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          test "${GITHUB_REF_NAME}" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p dist && g++ -std=c++17 -O2 src/main.cpp src/Lexer.cpp src/Parser.cpp -o dist/foxlang
      - run: tar -czf "FoxLang-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" -C dist foxlang
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: FoxLang-*-linux-x86_64.tar.gz

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: cmd
        run: mkdir dist && cl /EHsc /O2 /std:c++17 src/main.cpp src/Lexer.cpp src/Parser.cpp /Fe:dist\foxlang.exe
      - shell: pwsh
        run: Compress-Archive -Path dist/foxlang.exe -DestinationPath "FoxLang-${{ needs.validate.outputs.version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: FoxLang-*-windows-x86_64.zip

  release:
    needs: [validate, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: FoxLang ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: dist/*
