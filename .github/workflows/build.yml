name: Build and Auto Release FoxLang

on:
  # Started by hand as well: a failed release build is otherwise a dead end, because
  # only a change to VERSION starts this workflow and fixing the code does not change it.
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - VERSION

permissions:
  contents: write

concurrency:
  group: foxlang-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux graphics development packages
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxau-dev libxdmcp-dev

      - name: Verify source version
        run: |
          cmake -B build-check -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-check --config Release
          test "$(./build-check/foxlang --version)" = "FoxLang ${{ steps.version.outputs.version }}"
          test "$(./build-check/foxlang-lsp --version)" = "foxlang-lsp ${{ steps.version.outputs.version }}"

  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install native-window test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6
      - name: Build Linux binary and run tests
        run: |
          docker buildx build --target portable --output type=local,dest=build-portable .
          xvfb-run -a python3 tests/standalone/test_portable_linux.py build-portable/foxlang
          cp build-portable/foxlang foxlang.bin
          cp build-portable/foxlang-lsp foxlang-lsp.bin
      - name: Build installable Linux package and editor assets
        shell: bash
        run: |
          PKG="FoxLang-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "$PKG" dist-editors
          cp foxlang.bin "$PKG/foxlang.bin"
          cp foxlang-lsp.bin "$PKG/foxlang-lsp.bin"
          cp VERSION "$PKG/VERSION"
          cp packaging/linux/install.sh "$PKG/install.sh"
          chmod +x "$PKG/install.sh" "$PKG/foxlang.bin" "$PKG/foxlang-lsp.bin"
          cp -R std "$PKG/std"
          cp -R editors "$PKG/editors"

          # Build official .vsix package
          python3 packaging/package_vsix.py editors/vscode "${{ needs.version.outputs.version }}" "dist-editors/foxlang-${{ needs.version.outputs.version }}.vsix"
          cp "dist-editors/foxlang-${{ needs.version.outputs.version }}.vsix" "$PKG/foxlang-${{ needs.version.outputs.version }}.vsix"

          tar -czf "$PKG.tar.gz" "$PKG"

          # Standalone editor assets for direct download in GitHub Releases. The
          # unversioned copy keeps releases/latest/download/foxlang.vsix stable.
          cp "dist-editors/foxlang-${{ needs.version.outputs.version }}.vsix" dist-editors/foxlang.vsix
          cp editors/kate/foxlang.xml dist-editors/foxlang.xml
          (cd editors && zip -r ../dist-editors/foxlang-vscode.zip vscode)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: FoxLang-*-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: editors-release
          path: |
            dist-editors/foxlang.xml
            dist-editors/foxlang*.vsix
            dist-editors/foxlang-vscode.zip

  build-windows:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows binary and run tests
        shell: bash
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          mkdir -p dist
          if [ -f "./build/Release/foxlang.exe" ]; then
            cp ./build/Release/foxlang.exe dist/foxlang.exe
            cp ./build/Release/foxlang-lsp.exe dist/foxlang-lsp.exe
          else
            cp ./build/foxlang.exe dist/foxlang.exe
            cp ./build/foxlang-lsp.exe dist/foxlang-lsp.exe
          fi
          cp -R std dist/std
          cp -R editors dist/editors
          python packaging/package_vsix.py editors/vscode "${{ needs.version.outputs.version }}" "dist/foxlang-${{ needs.version.outputs.version }}.vsix"
      - shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "FoxLang-${{ needs.version.outputs.version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: FoxLang-*-windows-x86_64.zip

  release:
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist

      - name: Create version tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "FoxLang ${TAG#v}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FoxLang ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
